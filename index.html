<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExamPro Perfect</title>

<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>

<style>
:root{
  --bg:#06b6d4;
  --card:#ecfeff;
  --btn:#0284c7;
  --dark:#083344;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui;
  background:var(--bg);
  color:var(--dark);
}
header{
  background:#022c22;
  color:white;
  padding:12px;
  display:flex;
  justify-content:space-between;
  font-weight:bold;
}
.container{padding:12px}
.card{
  background:var(--card);
  padding:16px;
  border-radius:14px;
  margin-bottom:14px;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:var(--btn);
  color:white;
  font-size:16px;
  font-weight:bold;
  margin-top:8px;
}
.option{
  background:white;
  padding:12px;
  border-radius:10px;
  margin:8px 0;
  border:2px solid transparent;
}
.option.selected{border-color:#0ea5e9}
.option.correct{background:#bbf7d0}
.option.wrong{background:#fecaca}
.hidden{display:none}
.palette{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
}
.pbtn{
  aspect-ratio:1;
  border:none;
  border-radius:6px;
  background:#67e8f9;
  font-weight:bold;
}
.pbtn.done{background:#22c55e;color:white}
.pbtn.active{outline:2px solid black}
</style>
</head>

<body>

<header id="top" class="hidden">
<span id="modeTag"></span>
<span id="timer">00:00</span>
</header>

<div class="container">

<div id="home" class="card">
<h2>🚀 ExamPro Perfect</h2>
<button onclick="openSetup()">Start</button>
</div>

<div id="setup" class="card hidden">
<h3>Choose Mode</h3>
<button onclick="start('PRACTICE')">Practice Mode</button>
<button onclick="start('EXAM')">Exam Mode</button>
<button style="background:#64748b" onclick="location.reload()">Back</button>
</div>

<div id="quiz" class="hidden">
<div class="card">
<div id="qCount"></div>
<div id="qText"></div>
<div id="opts"></div>

<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
<button style="background:#ef4444" onclick="finish()">Submit</button>
</div>

<div class="card">
<h4>Questions</h4>
<div id="palette" class="palette"></div>
</div>
</div>

<div id="result" class="card hidden">
<h2>Result</h2>
<div id="scoreBox"></div>
<div id="progressBox"></div>
<button onclick="location.reload()">Home</button>
</div>

</div>

<script>
// ================= QUESTIONS =================
const QUESTIONS={
CET:{
Math:[
{q:"If $2x=10$, find $x$",o:["3","5","10","2"],a:1},
{q:"Derivative of $x^2$",o:["x","2x","x^3","1"],a:1}
],
Physics:[
{q:"SI unit of force?",o:["Watt","Newton","Joule","Pascal"],a:1}
]
},
KEAM:{
Chemistry:[
{q:"Atomic number of Oxygen?",o:["6","7","8","16"],a:2}
]
}
};
// ============================================

let list=[],ans=[],idx=0,mode="",time=0,timerInt=null;

// BUILD UNIQUE LIST (NO REPEAT EVER)
function buildList(){
list=[];
Object.values(QUESTIONS).forEach(exam=>{
Object.values(exam).forEach(sub=>{
sub.forEach(q=>list.push(q));
});
});
list=[...new Set(list)];
list.sort(()=>Math.random()-0.5);
ans=Array(list.length).fill(null);
}

function openSetup(){
home.classList.add("hidden");
setup.classList.remove("hidden");
}

function start(m){
mode=m;
buildList();
setup.classList.add("hidden");
quiz.classList.remove("hidden");
top.classList.remove("hidden");
modeTag.innerText=m+" MODE";
time=m==="EXAM"?list.length*60:0;

if(m==="EXAM"){
timerInt=setInterval(()=>{
time--;
timer.innerText=Math.floor(time/60)+":"+String(time%60).padStart(2,"0");
if(time<=0)finish();
},1000);
}else timer.innerText="∞";

buildPalette();
show(0);
}

function show(i){
idx=i;
qCount.innerText=`Q ${i+1}/${list.length}`;
qText.innerHTML=list[i].q;
opts.innerHTML="";
list[i].o.forEach((t,j)=>{
let d=document.createElement("div");
d.className="option"+(ans[i]===j?" selected":"");
d.innerHTML=t;
d.onclick=()=>{ans[i]=j;show(i)};
opts.appendChild(d);
});
updatePalette();
if(window.MathJax)MathJax.typeset();
}

function buildPalette(){
palette.innerHTML="";
list.forEach((_,i)=>{
let b=document.createElement("button");
b.className="pbtn";
b.innerText=i+1;
b.onclick=()=>show(i);
palette.appendChild(b);
});
}

function updatePalette(){
document.querySelectorAll(".pbtn").forEach((b,i)=>{
b.classList.toggle("active",i===idx);
b.classList.toggle("done",ans[i]!==null);
});
}

function next(){if(idx<list.length-1)show(idx+1)}
function prev(){if(idx>0)show(idx-1)}

function finish(){
clearInterval(timerInt);
quiz.classList.add("hidden");
top.classList.add("hidden");
result.classList.remove("hidden");

let correct=0;
list.forEach((q,i)=>{if(ans[i]===q.a)correct++});

let score=mode==="EXAM"?correct*2:correct;
scoreBox.innerHTML=`Score: <b>${score}</b><br>Correct: ${correct}/${list.length}`;
progressBox.innerHTML=`Accuracy: ${(correct/list.length*100).toFixed(1)}%`;
}
</script>
</body>
</html>
