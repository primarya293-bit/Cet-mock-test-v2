<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExamPro Master v5</title><script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script><script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script><style>:root{--p:#2563eb;--d:#0f172a;--c:#1e293b}body{margin:0;font-family:sans-serif;background:var(--d);color:#f8fafc}header{background:#020617;padding:1rem;display:flex;justify-content:space-between;border-bottom:2px solid var(--p);position:sticky;top:0;z-index:9}#home,#setup,#result{max-width:600px;margin:40px auto;padding:20px;background:var(--c);border-radius:12px;text-align:center}.quiz-grid{display:grid;grid-template-columns:1fr 300px;gap:15px;padding:15px}@media(max-width:768px){.quiz-grid{grid-template-columns:1fr}}.card{background:var(--c);padding:20px;border-radius:12px;box-shadow:0 4px 6px -1px #000}.option{background:#334155;padding:12px;border-radius:8px;margin:10px 0;cursor:pointer;border:2px solid transparent}.option:hover{background:#475569}.selected{border-color:var(--p);background:#1e40af}.correct{background:#15803d !important;border-color:#22c55e}.wrong{background:#b91c1c !important;border-color:#ef4444}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:#0f172a;padding:10px;border-radius:8px}.p-btn{aspect-ratio:1;border:none;border-radius:4px;background:#475569;color:#fff;cursor:pointer}.p-btn.active{outline:2px solid #fff}.p-btn.ans{background:#22c55e}.p-btn.mark{background:#a855f7}.hidden{display:none}button{cursor:pointer;background:var(--p);color:#fff;border:none;padding:10px 20px;border-radius:6px;font-weight:700;margin:5px}.sol-box{background:#1e293b;border-left:4px solid #22c55e;padding:10px;margin-top:10px;font-style:italic}</style></head><body><header id="h" class="hidden"><div id="eT"></div><div id="tD">00:00</div></header><div id="home" class="card"><h1>🚀 ExamPro PYQ</h1><div id="st"></div><button onclick="sS()">Start Mock Test</button></div><div id="setup" class="card hidden"><h2>Select Exam</h2><button onclick="iT('CET')">MHT-CET (90Q)</button><button onclick="iT('KEAM')">KEAM (120Q)</button></div><div id="quiz" class="hidden"><div class="quiz-grid"><div class="card"><div style="display:flex;justify-content:space-between;color:#94a3b8"><span id="qS">Sub</span><span id="qN">Q1</span></div><hr style="border:0;border-top:1px solid #334155;margin:15px 0"><h3 id="qT">Loading...</h3><div id="oL"></div><div id="solArea" class="hidden"></div><div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap"><button onclick="pQ()" class="secondary">Prev</button><button id="mBtn" onclick="mR()" style="background:#a855f7">Review</button><button onclick="nQ()">Next</button><button id="fBtn" onclick="fT()" style="background:#ef4444;margin-left:auto">Submit</button></div></div><div class="card"><h4>Palette</h4><div class="palette" id="pL"></div></div></div></div><div id="result" class="card hidden"><h2>Result</h2><div id="sR"></div><button onclick="revSol()">Review Solutions</button><button class="secondary" onclick="location.reload()">Home</button></div><script>
const B={CET:{P:[{q:"Speed of an electron in the ground state of Hydrogen atom is $c/137$. What is the speed in the second orbit?",o:["$c/274$","$c/137$","$c/68.5$","$c/548$"],a:0,e:"Speed $v \\propto 1/n$. For $n=2$, $v = (c/137) / 2 = c/274$."}],C:[{q:"The process of converting ores into oxides by heating strongly in excess of air is:",o:["Roasting","Calcination","Smelting","Reduction"],a:0,e:"Roasting involves excess air (sulfide ores), while Calcination involves limited air (carbonate ores)."}],M:[{q:"The area of the region bounded by $y^2 = 4x$ and $y = 2x$ is:",o:["1/3","2/3","1/4","1/6"],a:0,e:"Points of intersection are (0,0) and (1,2). Area = $\\int_0^1 (\\sqrt{4x} - 2x) dx = 1/3$."}]},KEAM:{P:[{q:"Which of the following is a scalar quantity?",o:["Force","Velocity","Electric Current","Acceleration"],a:2,e:"Current has direction but does not follow vector addition laws."}]}};
let qL=[],uA=[],m=[],cI=0,tR=0,tmr,cE="",isR=false;
function sS(){document.getElementById('home').classList.add('hidden');document.getElementById('setup').classList.remove('hidden')}
function iT(t){cE=t;qL=[];const s=B[t];Object.keys(s).forEach(sub=>{let pool=[...s[sub]];qL.push(...pool.map(q=>({...q,sub:sub}))) house(qL)});uA=Array(qL.length).fill(null);m=Array(qL.length).fill(false);tR=t==='CET'?180*60:150*60;document.getElementById('setup').classList.add('hidden');document.getElementById('h').classList.remove('hidden');document.getElementById('quiz').classList.remove('hidden');document.getElementById('eT').innerText=t+" Mock";rP();sQ(0);sT()}
function sQ(i){cI=i;const q=qL[i];document.getElementById('qS').innerText=q.sub;document.getElementById('qN').innerText=`Q ${i+1}/${qL.length}`;document.getElementById('qT').innerHTML=q.q;const l=document.getElementById('oL');l.innerHTML="";q.o.forEach((o,idx)=>{const d=document.createElement('div');d.className=`option ${uA[cI]===idx?'selected':''}`;if(isR){if(idx===q.a)d.classList.add('correct');else if(uA[cI]===idx)d.classList.add('wrong')}d.innerHTML=o;if(!isR)d.onclick=()=>{uA[cI]=idx;sQ(cI)};l.appendChild(d)});const sA=document.getElementById('solArea');if(isR){sA.classList.remove('hidden');sA.innerHTML=`<div class="sol-box"><b>Explanation:</b> ${q.e || 'Standard PYQ logic applies.'}</div>`}else{sA.classList.add('hidden')}if(window.MathJax)MathJax.typeset();uP()}
function rP(){const p=document.getElementById('pL');p.innerHTML="";qL.forEach((_,i)=>{const b=document.createElement('button');b.className="p-btn";b.innerText=i+1;b.onclick=()=>sQ(i);p.appendChild(b)})}
function uP(){const b=document.querySelectorAll('.p-btn');b.forEach((x,i)=>{x.classList.toggle('active',i===cI);x.classList.toggle('ans',uA[i]!==null);x.classList.toggle('mark',m[i])})}
function nQ(){if(cI<qL.length-1)sQ(cI+1)}
function pQ(){if(cI>0)sQ(cI-1)}
function mR(){m[cI]=!m[cI];uP()}
function sT(){tmr=setInterval(()=>{tR--;let mn=Math.floor(tR/60),sc=tR%60;document.getElementById('tD').innerText=`${mn}:${sc<10?'0':''}${sc}`;if(tR<=0)fT()},1000)}
function fT(){clearInterval(tmr);document.getElementById('quiz').classList.add('hidden');document.getElementById('h').classList.add('hidden');document.getElementById('result').classList.remove('hidden');let sc=0,cr=0;qL.forEach((q,i)=>{if(uA[i]===q.a){cr++;sc+=(cE==='CET'&&q.sub==='Math'?2:cE==='KEAM'?4:1)}else if(uA[i]!==null&&cE==='KEAM')sc-=1});document.getElementById('sR').innerHTML=`<h3>Score: ${sc}</h3><p>Correct: ${cr}</p>`}
function revSol(){isR=true;document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');document.getElementById('fBtn').classList.add('hidden');document.getElementById('mBtn').classList.add('hidden');sQ(0)}
function house(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
</script></body></html>
