<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ExamPro Mobile</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
    
    <style>
        :root { --p: #3b82f6; --bg: #0f172a; --card: #1e293b; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: #f8fafc; font-size: 16px; }
        
        header { background: #020617; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--p); position: sticky; top: 0; z-index: 100; }
        .container { padding: 12px; max-width: 100%; }
        .card { background: var(--card); padding: 16px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); margin-bottom: 16px; }
        
        .q-text { font-size: 1.1rem; line-height: 1.4; margin-bottom: 20px; }
        .option { background: #334155; padding: 14px; border-radius: 10px; margin: 10px 0; border: 2px solid transparent; cursor: pointer; transition: 0.2s; }
        .option.selected { border-color: var(--p); background: #1d4ed8; }
        .option.correct { background: #166534 !important; }
        .option.wrong { background: #991b1b !important; }

        /* Palette: 6 buttons per row on Redmi */
        .palette { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 15px; }
        .p-btn { aspect-ratio: 1; border: none; border-radius: 6px; background: #475569; color: white; font-weight: bold; font-size: 12px; }
        .p-btn.active { outline: 2px solid white; }
        .p-btn.ans { background: #22c55e; }
        .p-btn.mark { background: #a855f7; }

        button.main-btn { width: 100%; background: var(--p); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 16px; margin: 5px 0; }
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        .hidden { display: none; }
        .sol-box { background: #020617; padding: 12px; border-radius: 8px; border-left: 4px solid #22c55e; margin-top: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>

<header id="h-bar" class="hidden">
    <div id="exam-label" style="font-size: 0.9rem; font-weight: bold;"></div>
    <div id="time-label" style="color: #60a5fa; font-family: monospace;">00:00</div>
</header>

<div class="container">
    <div id="home-ui" class="card" style="text-align:center;">
        <h2 style="margin-top:0;">🚀 ExamPro v7</h2>
        <p>Optimized for Redmi Note 10 Pro</p>
        <button class="main-btn" onclick="openSetup()">START PRACTICE</button>
    </div>

    <div id="setup-ui" class="card hidden" style="text-align:center;">
        <h3>Choose Exam</h3>
        <button class="main-btn" onclick="start('CET')">MHT-CET (PCM)</button>
        <button class="main-btn" onclick="start('KEAM')">KEAM (Paper I/II)</button>
        <button class="main-btn" style="background:#475569" onclick="location.reload()">Back</button>
    </div>

    <div id="quiz-ui" class="hidden">
        <div class="card">
            <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:#94a3b8; margin-bottom:10px;">
                <span id="sub-tag">SUB</span>
                <span id="q-count">Q 1/1</span>
            </div>
            <div id="q-display" class="q-text">Loading question...</div>
            <div id="opt-list"></div>
            <div id="sol-display" class="hidden"></div>
            
            <div class="btn-row">
                <button class="main-btn" style="background:#64748b" onclick="prev()">Prev</button>
                <button class="main-btn" onclick="next()">Next</button>
            </div>
            <button class="main-btn" id="rev-btn" style="background:#a855f7" onclick="mark()">Mark for Review</button>
            <button class="main-btn" id="fin-btn" style="background:#ef4444" onclick="finish()">Submit Test</button>
        </div>

        <div class="card">
            <h4 style="margin:0 0 10px 0;">Question Palette</h4>
            <div id="p-grid" class="palette"></div>
        </div>
    </div>

    <div id="res-ui" class="card hidden" style="text-align:center;">
        <h2>Scoreboard</h2>
        <div id="final-score" style="font-size:2rem; margin:20px 0; color:#60a5fa;"></div>
        <button class="main-btn" onclick="review()">Review Solutions</button>
        <button class="main-btn" style="background:#475569" onclick="location.reload()">Home</button>
    </div>
</div>

<script>
const QUESTIONS = {
    CET: {
        Physics: [{q: "The SI unit of magnetic induction is:", o: ["Weber", "Tesla", "Henry", "Gauss"], a: 1, e: "Tesla (T) is the SI unit. 1 T = 1 Wb/m²."}],
        Math: [{q: "If $y = \\log(\\sin x)$, then $dy/dx$ is:", o: ["$\\tan x$", "$\\cot x$", "$\\sec x$", "$1/\\sin x$"], a: 1, e: "$y' = \\frac{1}{\\sin x} \\cdot \\cos x = \\cot x$."}]
    },
    KEAM: {
        Chemistry: [{q: "The number of electrons in $Mg^{2+}$ ion is:", o: ["12", "10", "14", "24"], a: 1, e: "Atomic number of Mg is 12. Loss of 2 electrons gives 10."}]
    }
};

let list = [], answers = [], marked = [], index = 0, timer = 0, exam = "", interval = null, isReview = false;

function openSetup() { 
    document.getElementById('home-ui').classList.add('hidden'); 
    document.getElementById('setup-ui').classList.remove('hidden'); 
}

function start(type) {
    exam = type;
    const data = QUESTIONS[type];
    Object.keys(data).forEach(s => data[s].forEach(q => list.push({...q, sub: s})));
    list.sort(() => Math.random() - 0.5);
    
    answers = Array(list.length).fill(null);
    marked = Array(list.length).fill(false);
    timer = (type === 'CET' ? 180 : 150) * 60;

    document.getElementById('setup-ui').classList.add('hidden');
    document.getElementById('h-bar').classList.remove('hidden');
    document.getElementById('quiz-ui').classList.remove('hidden');
    document.getElementById('exam-label').innerText = type + " MOCK";

    buildPalette();
    show(0);
    interval = setInterval(() => {
        timer--;
        let m = Math.floor(timer/60), s = timer%60;
        document.getElementById('time-label').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        if(timer <= 0) finish();
    }, 1000);
}

function show(i) {
    index = i;
    const q = list[i];
    document.getElementById('sub-tag').innerText = q.sub;
    document.getElementById('q-count').innerText = `Q ${i+1}/${list.length}`;
    document.getElementById('q-display').innerHTML = q.q;

    const opts = document.getElementById('opt-list');
    opts.innerHTML = "";
    q.o.forEach((text, idx) => {
        const d = document.createElement('div');
        d.className = `option ${answers[index] === idx ? 'selected' : ''}`;
        if(isReview) {
            if(idx === q.a) d.classList.add('correct');
            else if(answers[index] === idx) d.classList.add('wrong');
        }
        d.innerHTML = text;
        if(!isReview) d.onclick = () => { answers[index] = idx; show(index); };
        opts.appendChild(d);
    });

    const sol = document.getElementById('sol-display');
    if(isReview) {
        sol.classList.remove('hidden');
        sol.innerHTML = `<div class="sol-box"><b>Sol:</b> ${q.e}</div>`;
    }
    
    // Safety check for MathJax on mobile
    if(window.MathJax && window.MathJax.typeset) MathJax.typeset();
    updateUI();
}

function buildPalette() {
    const grid = document.getElementById('p-grid');
    grid.innerHTML = "";
    list.forEach((_, i) => {
        const b = document.createElement('button');
        b.className = "p-btn";
        b.innerText = i + 1;
        b.onclick = () => show(i);
        grid.appendChild(b);
    });
}

function updateUI() {
    const btns = document.querySelectorAll('.p-btn');
    btns.forEach((b, i) => {
        b.classList.remove('active', 'ans', 'mark');
        if(i === index) b.classList.add('active');
        if(answers[i] !== null) b.classList.add('ans');
        if(marked[i]) b.classList.add('mark');
    });
}

function next() { if(index < list.length - 1) show(index+1); }
function prev() { if(index > 0) show(index-1); }
function mark() { marked[index] = !marked[index]; updateUI(); }

function finish() {
    if(!confirm("Submit Test?")) return;
    clearInterval(interval);
    document.getElementById('quiz-ui').classList.add('hidden');
    document.getElementById('h-bar').classList.add('hidden');
    document.getElementById('res-ui').classList.remove('hidden');

    let score = 0;
    list.forEach((q, i) => {
        if(answers[i] === q.a) {
            if(exam === 'CET' && q.sub === 'Math') score += 2;
            else if(exam === 'KEAM') score += 4;
            else score += 1;
        } else if(answers[i] !== null && exam === 'KEAM') score -= 1;
    });
    document.getElementById('final-score').innerText = score;
}

function review() {
    isReview = true;
    document.getElementById('res-ui').classList.add('hidden');
    document.getElementById('quiz-ui').classList.remove('hidden');
    document.getElementById('fin-btn').classList.add('hidden');
    document.getElementById('rev-btn').classList.add('hidden');
    show(0);
}
</script>
</body>
</html>
